[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valeotf"
version = "0.4.0"
description = "Valeo Terraform Control Tower platform: inventory, map, import, plan, then manage."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Valeo Platform Engineering" }]
dependencies = [
  "jsonschema>=4.22.0",
  "PyYAML>=6.0.1",
  "click>=8.1.7",
]

[project.optional-dependencies]
aws = ["boto3>=1.34.0"]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
valeotf = "valeotf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
valeotf = ["data/*.json", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
