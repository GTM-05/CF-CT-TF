api_version: valeotf.account-request/v1

account:
  name: example-existing-adopt
  owner: platform-team
  environment: test
  business_unit: example
  country: france
  requested_ou: non-production
  existing_account_id: "123456789012"

cloud:
  provider: aws
  region: eu-west-1

governance:
  control_tower: true
  required_controls:
    - baseline-security
    - logging
  enroll_if_unenrolled: false

network:
  required: true
  network_profile: standard

security:
  encryption: true
  monitoring: true

baseline:
  iam: true
  ec2: false
  rds: false
  backup: true
  ssm: true
  config: true
  logging: true
  kms: true

tags:
  application: example
  cost_center: "12345"

migration:
  mode: adopt-existing
  batch_id: batch-001
  dry_run: true
