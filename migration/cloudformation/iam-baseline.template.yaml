AWSTemplateFormatVersion: "2010-09-09"
Description: Sample IAM baseline.

Resources:
  AdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: valeotf-account-admin
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
